name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: test (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]

    steps:
      - uses: actions/checkout@v4

      # The runner image's git usually predates 2.55, which would skip the
      # `git history fixup` engine tests; the git-core PPA ships current releases.
      - name: Install latest Git
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git
          git --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Check TypeScript compilation
        run: bun run typecheck

      - name: Run tests (Bun)
        if: matrix.runtime == 'bun'
        run: bun test

      - name: Run tests (Node.js)
        if: matrix.runtime == 'node'
        run: node --test

      - name: CLI smoke test (Node.js)
        if: matrix.runtime == 'node'
        run: node src/index.ts --help
