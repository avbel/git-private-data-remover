<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Git Private Data Remover</title>
  <desc id="desc">A mint shield protecting a Git branch, with an erased segment representing private data removed from history.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172B3D"/>
      <stop offset="1" stop-color="#0B1420"/>
    </linearGradient>
    <linearGradient id="shield" x1="98" y1="76" x2="302" y2="284" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CF3D0"/>
      <stop offset="1" stop-color="#35C9AB"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="358" rx="32" fill="url(#background)" stroke="#2A3C4C" stroke-width="2"/>
  <path d="M200 66 300 105v72c0 62-43 102-100 126-57-24-100-64-100-126v-72Z" fill="#152F36" stroke="url(#shield)" stroke-width="7" stroke-linejoin="round"/>
  <g stroke="#7CECC8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M174 138v104"/>
    <path d="M174 204c0-34 61-24 61-61v-5"/>
  </g>
  <g fill="#142D35" stroke="#8CF3D0" stroke-width="7">
    <circle cx="174" cy="134" r="13"/>
    <circle cx="174" cy="245" r="13"/>
    <circle cx="235" cy="130" r="13"/>
  </g>
  <path d="m198 178 23-13" stroke="#152F36" stroke-width="21"/>
  <path d="m204 183 18-10" stroke="#7CECC8" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 9" opacity=".5"/>
  <path d="M354 92v176" stroke="#304353" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="400" y="146" fill="#F2F7FA" font-size="61" font-weight="700" letter-spacing="-2">git private</text>
    <text x="400" y="218" fill="#8CF3D0" font-size="61" font-weight="700" letter-spacing="-2">data remover</text>
    <text x="403" y="269" fill="#AABBC9" font-size="23" letter-spacing="1.1">PRIVATE DATA OUT. CODE INTACT.</text>
  </g>
</svg>
